                aria-expanded="false"><span></span><span></span><span></span></button>
            <nav class="nav-links" aria-label="Primary navigation"><a href="index.html#home">Home</a><a
                    href="index.html#what-we-do">What We Do</a><a class="active" href="books.html">Books</a><a

    <main id="bookPage">
        <section class="section"><div class="container center"><p class="comment-empty" style="padding:5rem 0">Loading book...</p></div></section>
        <!-- Shown only if the CMS can't be reached, so Book 1's page never goes blank. -->
        <template id="bookFallback">
        <section class="book-page-hero">
            <div class="container book-page-grid">
                <div class="book-page-image reveal"><img src="assets/My Story Writing Adventure Book Mockup.png"
                        alt="My Story Writing Adventure book"></div>
                <div class="book-page-copy reveal delay-1"><span class="eyebrow"><span class="eyebrow-dot"></span> Young
                        Author Adventure Series • Book 1</span>
                    <h1>My Story Writing <span>Adventure</span></h1>
                    <p class="hero-lead">A Creative Writing Journal for Kids Ages 7–12</p>
                    <p>What if writing a story could feel less like an assignment and more like an adventure?</p>
                    <p><strong>My Story Writing Adventure</strong> gives young writers a clear, encouraging path through
                        the story-writing process. Children can develop an idea, plan what happens, write their story,
                        and reflect on what they created.</p>
                    <div class="hero-actions"><a class="btn btn-primary"
                            href="https://www.amazon.com/My-Story-Writing-Adventure-Creative/dp/B0HGWNB63B?ref_=ast_author_mpb"
                            target="_blank" rel="noopener">Get the Book on Amazon <span>→</span></a></div>
                </div>
            </div>
        </section>
        <section class="section">
            <div class="container book-detail-grid">
                <div class="detail-main reveal"><span class="section-kicker">What children experience</span>
                    <h2>A structured path without taking away the imagination.</h2>
                    <p>The journal is built around repeated story-writing adventures. Each adventure gives children
                        space to think about their idea before they write, develop the important parts of the story, and
                        look back at what they have created.</p>
                    <div class="detail-cards">
                        <article><strong>Plan the idea</strong>
                            <p>Give the story a direction before the writing begins.</p>
                        </article>
                        <article><strong>Write the story</strong>
                            <p>Turn the plan into original writing in a dedicated space.</p>
                        </article>
                        <article><strong>Reflect & grow</strong>
                            <p>Look back, notice progress, and build writing confidence.</p>
                        </article>
                    </div>
                </div>
                <aside class="book-facts reveal delay-1"><span class="fact-label">Book 1</span>
                    <h3>My Story Writing Adventure</h3>
                    <p>A Creative Writing Journal for Kids</p>
                    <ul>
                        <li>Ages 7–12</li>
                        <li>60 story-writing adventures</li>
                        <li>Plan • Write • Reflect</li>
                        <li>Achievement rewards</li>
                        <li>Young Author completion experience</li>
                    </ul>
                </aside>
            </div>
        </section>
        <section class="section book-freebie-bridge">
            <div class="container bridge-grid">
                <div class="reveal"><span class="section-kicker">Free support for Book 1</span>
                    <h2>The adventure doesn't stop when the book closes.</h2>
                </div>
                <div class="reveal delay-1">
                    <p>Book 1 is supported by a free resource area created for the adults and young writers using the
                        journal. It currently includes a <strong>Parent & Teacher Guide</strong> and a <strong>Young
                            Author Reward Pack</strong> to help adults encourage progress and help children celebrate
                        their writing journey.</p><a class="btn btn-primary" href="freebies.html">See the Free Resources
                        <span>→</span></a>
                </div>
            </div>
        </section>
        <section class="cta-strip">
            <div class="container cta-inner">
                <div><span class="section-kicker light">My Story Writing Adventure</span>
                    <h2>Imagine. Write. Become.</h2>
                </div>
                <p>Your story starts with an idea.</p>
            </div>
        </section>
    </template>
    </main>
    <footer class="site-footer">
        <div class="container footer-grid">

                            Adventures for Young Minds</small></span></a>
                <p>NobleSPark Publishing.</p>
            </div>
            <div class="footer-links"><strong>Explore</strong><a href="index.html#what-we-do">What We Do</a><a
                    href="books.html">Books</a><a href="freebies.html">Free Resources</a><a href="blog.html">Blog</a><a
                    href="about.html">About</a></div>
            <div class="footer-links"><strong>Copyright</strong><span>© <span id="year"></span> <span data-setting="site_name">Noble Hart</span></span></div>
        </div>
    </footer><button id="backToTop" class="back-to-top" type="button" aria-label="Back to top"><svg width="20"
            height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
            stroke-linejoin="round">
            <line x1="12" y1="19" x2="12" y2="5"></line>

        </svg></button>
    <script src="script.js"></script>
  <script src="cms-config.js"></script>
  <script src="cms-site.js"></script>

  <script>
    (function () {
      const page = document.getElementById("bookPage");
      const FALLBACK_SLUG = "my-story-writing-adventure";

      function esc(str) {
        const d = document.createElement("div");
        d.textContent = str == null ? "" : String(str);
        return d.innerHTML;
      }
      const isReal = (u) => !!u && !/example\.com/i.test(u);

      // Plain text (blank lines = new paragraph) or HTML — both accepted.
      function richText(text) {
        const t = String(text || "").trim();
        if (!t) return "";
        if (/<[a-z][\s\S]*>/i.test(t)) return t;
        return t.split(/\n\s*\n|\n/).map((p) => "<p>" + esc(p.trim()) + "</p>").filter((p) => p !== "<p></p>").join("");
      }

      function twoTone(title) {
        const words = String(title).trim().split(/\s+/);
        if (words.length < 2) return esc(title);
        return esc(words.slice(0, -1).join(" ")) + " <span>" + esc(words[words.length - 1]) + "</span>";
      }

      function showFallback(slug) {
        const tpl = document.getElementById("bookFallback");
        if (tpl && (!slug || slug === FALLBACK_SLUG)) {
          page.innerHTML = tpl.innerHTML;
        } else {
          page.innerHTML = '<section class="section"><div class="container center" style="padding:4rem 0"><h1>Book not found</h1><p>We couldn\'t find that book.</p><a class="btn btn-primary" href="books.html">See all books <span>→</span></a></div></section>';
        }
      }

      function render(b, freebies) {
        const published = String(b.Status).toLowerCase() === "published";
        const cover = isReal(b.Cover_Image_URL) ? b.Cover_Image_URL : "assets/noble-hart-logo.webp";
        const eyebrow = [b.Series_Name, b.Series_Number ? "Book " + b.Series_Number : ""].filter(Boolean).join(" • ");
        const intro = richText(b.Long_Description) || richText(b.Description);
        const highlights = String(b.Highlights || "").split(/\n/).map((s) => s.trim()).filter(Boolean);

        let action = "";
        if (published && isReal(b.Amazon_URL)) {
          action = '<a class="btn btn-primary" href="' + esc(b.Amazon_URL) + '" target="_blank" rel="noopener">Get the Book on Amazon <span>→</span></a>';
        } else if (!published) {
          action = '<span class="eyebrow"><span class="eyebrow-dot"></span> Coming soon</span>';
        }

        let html = '<section class="book-page-hero"><div class="container book-page-grid">' +
          '<div class="book-page-image reveal"><img src="' + esc(cover) + '" alt="' + esc(b.Title) + '"></div>' +
          '<div class="book-page-copy reveal delay-1">' +
          (eyebrow ? '<span class="eyebrow"><span class="eyebrow-dot"></span> ' + esc(eyebrow) + '</span>' : "") +
          "<h1>" + twoTone(b.Title) + "</h1>" +
          (b.Subtitle ? '<p class="hero-lead">' + esc(b.Subtitle) + "</p>" : "") +
          intro +
          (action ? '<div class="hero-actions">' + action + "</div>" : "") +
          "</div></div></section>";

        const detail = richText(b.Detail_Content);
        if (detail || highlights.length) {
          html += '<section class="section"><div class="container book-detail-grid">' +
            '<div class="detail-main reveal">' + detail + "</div>" +
            (highlights.length
              ? '<aside class="book-facts reveal delay-1">' +
                (b.Series_Number ? '<span class="fact-label">Book ' + esc(b.Series_Number) + "</span>" : "") +
                "<h3>" + esc(b.Title) + "</h3>" +
                (b.Subtitle ? "<p>" + esc(b.Subtitle) + "</p>" : "") +
                "<ul>" + highlights.map((h) => "<li>" + esc(h) + "</li>").join("") + "</ul></aside>"
              : "") +
            "</div></section>";
        }

        const fb = b.Related_Freebie_ID ? (freebies || []).find((f) => f.Freebie_ID === b.Related_Freebie_ID) : null;
        if (fb) {
          html += '<section class="section book-freebie-bridge"><div class="container bridge-grid">' +
            '<div class="reveal"><span class="section-kicker">Free support for this book</span>' +
            "<h2>" + esc(fb.Title) + "</h2></div>" +
            '<div class="reveal delay-1"><p>' + esc(fb.Description || "") + '</p>' +
            '<a class="btn btn-primary" href="freebies.html">See the Free Resources <span>→</span></a></div>' +
            "</div></section>";
        }

        if (published && isReal(b.Amazon_URL)) {
          html += '<section class="cta-strip"><div class="container cta-inner">' +
            '<div><span class="section-kicker light">' + esc(b.Title) + "</span><h2>Ready to begin?</h2></div>" +
            '<a class="btn btn-gold" href="' + esc(b.Amazon_URL) + '" target="_blank" rel="noopener">Get it on Amazon <span>→</span></a>' +
            "</div></section>";
        }

        page.innerHTML = html;
        document.title = b.Title + " — Noble Hart";
        const meta = document.querySelector('meta[name="description"]');
        if (meta && b.Description) meta.setAttribute("content", b.Description);
      }

      const slug = new URLSearchParams(location.search).get("slug");
      if (typeof CMS_API_URL === "undefined" || /PASTE_YOUR/.test(CMS_API_URL)) return showFallback(slug);

      Promise.all([
        fetch(CMS_API_URL + "?action=books").then((r) => r.json()),
        fetch(CMS_API_URL + "?action=freebies").then((r) => r.json()).catch(() => []),
      ])
        .then(function (res) {
          const books = res[0] || [];
          // No ?slug= in the link → show the first published book.
          const book = slug
            ? books.find((b) => b.Slug === slug)
            : books.find((b) => String(b.Status).toLowerCase() === "published") || books[0];
          if (!book) return showFallback(slug);
          render(book, res[1]);
        })
        .catch(function () {
          showFallback(slug);
        });
    })();
  </script>
</body>

</html>
